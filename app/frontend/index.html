<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Chatbot</title>
  <!-- Load Marked.js for Markdown parsing and DOMPurify for safe HTML rendering -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
  <style>
    :root {
      --bg: #ffffff;
      --panel: #f7f8fa;
      --border: #d0d7de;
      --user-bg: #eef2f6;
      --bot-bg: #ffffff;
      --text: #000000;
      --muted: #333333;
      --code-bg: #f6f8fa;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, Helvetica, sans-serif; color: var(--text); }
    body { background: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100vh; width: 100%; }
    header {
      padding: 14px 28px; background: var(--panel); border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center; width: 100%;
    }
    header h1 { font-size: 1.1rem; font-weight: 700; color: var(--text); letter-spacing: 0.2px; }
    .controls { display: flex; gap: 10px; align-items: center; }
    .badge {
      font-size: 0.8rem; color: var(--muted); background: var(--bg);
      padding: 5px 10px; border-radius: 6px; border: 1px solid var(--border);
    }
    button.clear-btn {
      background: var(--bg); color: var(--text); border: 1px solid var(--border);
      padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; font-weight: 500;
    }
    button.clear-btn:hover { background: #f0f2f5; border-color: #000000; }
    #chat-box {
      flex: 1; overflow-y: auto; padding: 24px 28px; display: flex; flex-direction: column; gap: 14px;
      width: 100%; background: var(--bg);
    }
    .msg {
      padding: 12px 16px; border-radius: 10px; max-width: 82%; line-height: 1.55;
      word-wrap: break-word; border: 1px solid var(--border); color: var(--text);
    }
    .user { background: var(--user-bg); align-self: flex-end; white-space: pre-wrap; }
    .bot { background: var(--bot-bg); align-self: flex-start; }

    /* Markdown formatting styles inside bot replies */
    .bot p { margin-bottom: 10px; }
    .bot p:last-child { margin-bottom: 0; }
    .bot h1, .bot h2, .bot h3 { margin: 14px 0 8px; font-weight: 700; }
    .bot ul, .bot ol { margin: 8px 0 10px 22px; }
    .bot li { margin-bottom: 4px; }
    .bot hr { border: none; border-top: 1px solid var(--border); margin: 12px 0; }
    .bot code {
      font-family: Consolas, Monaco, "Courier New", monospace;
      background: var(--code-bg); padding: 2px 5px; border-radius: 4px;
      font-size: 0.9em; border: 1px solid var(--border);
    }
    .bot pre {
      background: var(--code-bg); padding: 12px; border-radius: 8px;
      overflow-x: auto; margin: 10px 0; border: 1px solid var(--border);
    }
    .bot pre code { background: none; border: none; padding: 0; }
    .bot table {
      border-collapse: collapse; width: 100%; margin: 12px 0; font-size: 0.92rem;
    }
    .bot th, .bot td {
      border: 1px solid var(--border); padding: 8px 12px; text-align: left; vertical-align: top;
    }
    .bot th { background: var(--panel); font-weight: 700; }

    form {
      display: flex; gap: 12px; padding: 16px 28px; background: var(--panel);
      border-top: 1px solid var(--border); width: 100%;
    }
    input {
      flex: 1; padding: 12px 14px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--bg); color: var(--text); font-size: 0.95rem; outline: none;
    }
    input::placeholder { color: #555555; }
    input:focus { border-color: #000000; }
    button[type="submit"] {
      padding: 0 22px; border: 1px solid #000000; border-radius: 8px; background: #ffffff;
      color: #000000; font-weight: 600; cursor: pointer;
    }
    button[type="submit"]:hover { background: #eef2f6; }
    button[type="submit"]:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>
  <header>
    <h1>AI Chatbot</h1>
    <div class="controls">
      <span id="session-label" class="badge"></span>
      <button class="clear-btn" onclick="clearChat()">New Chat</button>
    </div>
  </header>

  <div id="chat-box"></div>

  <form id="chat-form">
    <input id="prompt-input" type="text" placeholder="Type a message..." autocomplete="off" required />
    <button id="send-btn" type="submit">Send</button>
  </form>

  <script>
    const chatBox = document.getElementById("chat-box");
    const form = document.getElementById("chat-form");
    const input = document.getElementById("prompt-input");
    const sendBtn = document.getElementById("send-btn");
    const sessionLabel = document.getElementById("session-label");

    // Enable GitHub Flavored Markdown (tables, line breaks)
    marked.setOptions({ gfm: true, breaks: true });

    let sessionId = "sess_" + Math.random().toString(36).slice(2, 9);
    sessionLabel.textContent = sessionId;

    function appendMessage(role, text = "") {
      const div = document.createElement("div");
      div.className = `msg ${role}`;
      div.textContent = text;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
      return div;
    }

    async function clearChat() {
      await fetch(`/history/${sessionId}`, { method: "DELETE" });
      chatBox.innerHTML = "";
      sessionId = "sess_" + Math.random().toString(36).slice(2, 9);
      sessionLabel.textContent = sessionId;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const message = input.value.trim();
      if (!message) return;

      appendMessage("user", message);
      input.value = "";
      sendBtn.disabled = true;

      const botDiv = appendMessage("bot", "");
      let rawMarkdown = "";

      try {
        const response = await fetch("/chat/stream", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ session_id: sessionId, message }),
        });

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });
          const events = buffer.split("\n\n");
          buffer = events.pop();

          for (const event of events) {
            if (!event.startsWith("data: ")) continue;
            const payload = JSON.parse(event.slice(6));
            if (payload.token) {
              rawMarkdown += payload.token;
              botDiv.innerHTML = DOMPurify.sanitize(marked.parse(rawMarkdown));
              chatBox.scrollTop = chatBox.scrollHeight;
            } else if (payload.error) {
              rawMarkdown += `\n\n**Error:** ${payload.error}`;
              botDiv.innerHTML = DOMPurify.sanitize(marked.parse(rawMarkdown));
            }
          }
        }
      } catch (err) {
        botDiv.textContent = `[Network Error: ${err.message}]`;
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
